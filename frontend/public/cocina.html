<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel cocina — Hotel Andino</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
</head>
<body>
  <div id="encabezado-contenedor"></div>

  <p id="estado-carga">Cargando…</p>

  <div id="estado-error-sesion" class="estado-error" hidden>
    <p>No se pudo verificar tu sesión.</p>
    <button type="button" id="boton-reintentar-sesion" class="boton boton--secundario">Reintentar</button>
  </div>

  <main id="contenido-panel" hidden>
    <div class="panel-titulo">
      <h1>Panel cocina</h1>
      <button type="button" id="boton-actualizar-pedidos" class="boton boton--secundario">Actualizar</button>
    </div>

    <p id="error-cocina" class="banner-error" hidden></p>

    <div class="tablero-cocina">
      <section class="seccion-panel">
        <h2>Pendientes</h2>
        <div id="cola-pendientes" class="cola-pedidos"></div>
      </section>

      <section class="seccion-panel">
        <h2>En preparación</h2>
        <div id="cola-en-preparacion" class="cola-pedidos"></div>
      </section>
    </div>
  </main>

  <script src="/js/comun/dialogo.js" defer></script>
  <script src="/js/comun/clienteApi.js" defer></script>
  <script src="/js/comun/sesion.js" defer></script>
  <script src="/js/comun/header.js" defer></script>
  <script src="/js/comun/panel.js" defer></script>
  <script src="/js/cocina.js" defer></script>
</body>
</html>
