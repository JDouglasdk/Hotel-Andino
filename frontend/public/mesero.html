<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel mesero — Hotel Andino</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
</head>
<body>
  <div id="encabezado-contenedor"></div>

  <p id="estado-carga">Cargando…</p>

  <div id="estado-error-sesion" class="estado-error" hidden>
    <p>No se pudo verificar tu sesión.</p>
    <button type="button" id="boton-reintentar-sesion" class="boton boton--secundario">Reintentar</button>
  </div>

  <main id="contenido-panel" hidden>
    <h1>Panel mesero</h1>

    <section class="seccion-panel">
      <h2>Identificar huésped</h2>
      <form id="formulario-buscar-huesped" class="formulario">
        <div class="campo">
          <label for="documento-huesped">Documento del huésped</label>
          <input type="text" id="documento-huesped" name="documento" autocomplete="off">
        </div>
        <button type="submit" id="boton-buscar-huesped" class="boton boton--primario">Buscar</button>
      </form>
      <p id="error-huesped" class="banner-error" hidden></p>
      <div id="resultado-huesped" class="tarjeta-huesped" hidden></div>
    </section>

    <section id="seccion-comanda" class="seccion-panel" hidden>
      <h2>Registrar comanda</h2>
      <form id="formulario-comanda" class="formulario">
        <div class="campo">
          <label for="franja-comanda">Franja</label>
          <select id="franja-comanda" name="franja">
            <option value="desayuno">Desayuno</option>
            <option value="almuerzo">Almuerzo</option>
            <option value="cena">Cena</option>
          </select>
        </div>
        <p id="mensaje-platos" hidden></p>
        <div id="lista-platos" class="lista-platos"></div>
        <button type="submit" id="boton-registrar-comanda" class="boton boton--primario">Registrar comanda</button>
      </form>
      <p id="error-comanda" class="banner-error" hidden></p>
      <p id="exito-comanda" class="banner-exito" hidden></p>
    </section>

    <section class="seccion-panel">
      <div class="panel-titulo">
        <h2>Pedidos listos para entregar</h2>
        <button type="button" id="boton-actualizar-listos" class="boton boton--secundario">Actualizar</button>
      </div>
      <p id="error-listos" class="banner-error" hidden></p>
      <div id="contenido-listos"></div>
    </section>
  </main>

  <script src="/js/comun/dialogo.js" defer></script>
  <script src="/js/comun/clienteApi.js" defer></script>
  <script src="/js/comun/sesion.js" defer></script>
  <script src="/js/comun/header.js" defer></script>
  <script src="/js/comun/panel.js" defer></script>
  <script src="/js/mesero.js" defer></script>
</body>
</html>
