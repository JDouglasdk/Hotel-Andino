<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel jefe de caja — Hotel Andino</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
</head>
<body>
  <div id="encabezado-contenedor"></div>

  <p id="estado-carga">Cargando…</p>

  <div id="estado-error-sesion" class="estado-error" hidden>
    <p>No se pudo verificar tu sesión.</p>
    <button type="button" id="boton-reintentar-sesion" class="boton boton--secundario">Reintentar</button>
  </div>

  <main id="contenido-panel" hidden>
    <div class="panel-titulo">
      <h1>Panel jefe de caja</h1>
      <button type="button" id="boton-actualizar-reportes" class="boton boton--secundario">Actualizar</button>
    </div>

    <section class="seccion-panel">
      <h2>Caja del día</h2>
      <p id="error-caja-del-dia" class="banner-error" hidden></p>
      <div id="resumen-caja-del-dia" class="resumen-caja"></div>
    </section>

    <section class="seccion-panel">
      <h2>Platos servidos por franja</h2>
      <p id="error-platos-por-franja" class="banner-error" hidden></p>
      <div id="contenido-platos-por-franja"></div>
    </section>

    <section class="seccion-panel">
      <h2>Inventario de ingredientes</h2>
      <p class="nota-seccion">Solo lectura: la actualización de stock la realiza el administrador.</p>
      <p id="error-inventario" class="banner-error" hidden></p>
      <div id="contenido-inventario"></div>
    </section>
  </main>

  <script src="/js/comun/dialogo.js" defer></script>
  <script src="/js/comun/clienteApi.js" defer></script>
  <script src="/js/comun/sesion.js" defer></script>
  <script src="/js/comun/header.js" defer></script>
  <script src="/js/comun/panel.js" defer></script>
  <script src="/js/jefeDeCaja.js" defer></script>
</body>
</html>
